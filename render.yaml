# Initial development deployment only. Upgrade after the pilot and cost review.
services:
  - type: web
    name: re-golf-development
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_SECRET
        sync: false
      # Stripe TEST keys only on this service.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CONNECT_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PREVIEW_ACCESS_PASSWORD
        generateValue: true
# APP_ORIGIN defaults to Render's assigned HTTPS URL. For a custom domain,
# set APP_ORIGIN in Render and update Supabase's redirect allowlist together.
